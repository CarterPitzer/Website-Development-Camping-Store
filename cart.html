<h2>Your Cart</h2>

<div class="cart-container">

    <table class="cart-table">
        <thead>
            <tr>
                <th>Product</th>
                <th>Price</th>
                <th>Remove</th>
            </tr>
        </thead>

        <tbody id="cart-items">

    <div class="cart-total-box">
        <h3>Total: <span id="cart-total">$0.00</span></h3>
        <button class="checkout-btn" onclick="checkout()">Checkout</button>
    </div>

</div>
